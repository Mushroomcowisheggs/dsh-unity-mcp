name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: package.json is valid JSON + required fields present
        run: |
          node -e "const p=require('./package.json'); if(!p.name||!p.main||!p.license) process.exit(1); if(p.dsh?.bundle?.patch !== './cordis.patch.yml') process.exit(1); console.log('package.json OK')"

      - name: lib entry is valid ESM
        run: node --check lib/index.js

      - name: bundle patch references the entry
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('./cordis.patch.yml','utf8'); if(!s.includes('dsh-unity-mcp')) process.exit(1); console.log('cordis.patch.yml OK')"

      - name: vendored server ships an entry
        run: node -e "require('fs').accessSync('vendor/mcp-unity-server/build/index.js'); console.log('vendor entry OK')"

      - name: npm pack --dry-run (files field respected)
        run: npm pack --dry-run